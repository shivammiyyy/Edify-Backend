# Local development stack: Postgres + pgvector, Redis, MinIO, and Kafka run in Docker.
# The Spring/Vert.x backend and Vite frontend run natively on your machine for fast
# hot-reload (`mvn spring-boot:run`, `npm run dev`), talking to this DB on localhost:5432
# and to your local Ollama on localhost:11434 -- nothing here rebuilds the app image.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   mvn spring-boot:run                     (backend, port 8080)
#   cd Frontend && npm run dev              (frontend, port 5173)
#
# For a fully containerized build (mirrors production), use docker-compose.prod.yml instead:
#   docker compose -f docker-compose.prod.yml up --build -d
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag_ingestor
      POSTGRES_USER: rag_app
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-rag_app_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_app -d rag_ingestor"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-edify-local-access}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-edify-local-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object_data_dev:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "29092:29092"
    volumes:
      - kafka_data_dev:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  # Optional lightweight DB browser for local development. Open http://localhost:8081,
  # System=PostgreSQL, Server=db, Username=rag_app, Password=<DATABASE_PASSWORD>, DB=rag_ingestor.
  adminer:
    image: adminer:4
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8081:8080"

volumes:
  postgres_data_dev:
  redis_data_dev:
  object_data_dev:
  kafka_data_dev:
